name: Deploy Valdivia Bike Fest to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Permisos específicos para este proyecto
permissions:
  contents: read
  pages: write
  id-token: write

# Solo permite un deploy a la vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Solo sube archivos HTML, CSS, JS e imágenes
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
